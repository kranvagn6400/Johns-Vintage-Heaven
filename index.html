<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241810">
<meta name="description" content="Johns Vinyl Heaven — أسطوانات من الزمن الجميل، توصيل لكل محافظات العراق والدفع عند الاستلام أو عن طريق الدفع الإلكتروني.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/kufi-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/themes.css">
<!-- ثيم المتجر (شعار + ألوان) يُطبَّق قبل رسم الصفحة -->
<script src="js/themes.js"></script>
<link rel="stylesheet" href="css/pixel.css">
<!-- عيّنة البكسل الريترو: ?pixel=1 لتشغيلها و ?pixel=0 لإيقافها (تُحفظ في المتصفح) -->
<script>try{var q=new URLSearchParams(location.search).get("pixel");if(q==="1")localStorage.setItem("jvh_style","\"pixel\"");if(q==="0")localStorage.removeItem("jvh_style");if(localStorage.getItem("jvh_style")==="\"pixel\""){document.documentElement.classList.add("pixel");document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">')}}catch(e){}</script>
<script>try{var t=localStorage.getItem('jvh_theme');if(t==='"dark"'||t==='"light"')document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
<title>Johns Vinyl Heaven</title>
</head>
<body>
<header id="topbar">
  <div class="tb-in">
    <a class="brand" href="#/">
      <img class="brand-mark" src="logos/classic.png" alt="" data-logo>
      <span class="brand-name">Johns Vinyl Heaven<small class="brand-tag">Let the music spin</small></span>
    </a>
    <nav class="tb-nav" id="tbNav"></nav>
    <div class="tb-actions">
      <a class="tb-btn tb-search" href="#/shop?focus=1" aria-label="بحث"><i data-i="search"></i></a>
      <a class="tb-btn" id="tbCart" href="#/cart" aria-label="السلة"><i data-i="cart"></i><span class="badge hidden" id="cartBadge"></span></a>
      <a class="tb-btn hidden" id="tbAccount" href="#/account" aria-label="حسابي"><i data-i="user"></i></a>
    </div>
  </div>
</header>
<script>Themes.apply(Themes.current())</script>
<div id="demoBar" class="demo-bar hidden"></div>
<div id="announce" class="announce hidden"></div>

<main id="app"></main>

<nav id="bottomnav"></nav>

<div id="sheet" class="sheet">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet-box">
    <button class="icon-btn sheet-close" type="button" onclick="closeSheet()" aria-label="إغلاق"><i data-i="x"></i></button>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="busy"><div class="bx"><span class="spin-disc"></span><span id="busyText"></span></div></div>

<script src="config.js"></script>
<script src="js/util.js"></script>
<script src="js/ui.js"></script>
<script src="js/pixel.js"></script>
<script src="js/api.js"></script>
<script src="js/demo.js"></script>
<script src="js/shop.js"></script>
<script src="js/seller.js"></script>
<script src="js/owner.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
<script src="js/picker.js"></script>
</body>
</html>
